<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>쿠크다스의 모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="게임 화면"></canvas>

<div id="hud">
  <div id="leftCol">
  <div id="stats" class="panel">
    <div class="coinRow"><span class="coinIco" aria-hidden="true"></span><span id="coins">0</span></div>
    <div class="subRow">초당 <b id="cps">0</b> · 클릭 <i id="clickv">1</i></div>
    <div class="chips"><span class="chip gem"><span class="gemIco"></span><span id="gemsTxt">0</span></span><span id="multChip" class="chip mult">배율 x1.00</span><span id="starChip" class="chip star">별 0/24</span><span id="rebChip" class="chip reb hidden">환생 0</span></div>
    <div id="buffs" class="chips hidden"></div>
  </div>

  <div id="quest" class="panel">
    <div class="qhead"><span class="qlabel">목표</span><span id="qnum">1/18</span></div>
    <div id="qtext">불러오는 중…</div>
    <div class="bar"><i id="qbar"></i></div>
    <div id="qreward"></div>
  </div>
  </div>

  <div id="timer" class="panel hidden"><span id="tzone">코스</span><b id="ttime">0.00</b></div>

  <div id="side">
    <canvas id="minimap" width="320" height="320" aria-label="미니맵"></canvas>
    <div id="sideBtns">
      <button id="btnShop" class="ibtn" title="상점 열기 (B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>상점</span> <kbd>B</kbd></button>
      <button id="btnDex" class="ibtn" title="펫 · 도감 (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="9" r="1.8"/><circle cx="10" cy="5.5" r="1.8"/><circle cx="14" cy="5.5" r="1.8"/><circle cx="17.5" cy="9" r="1.8"/><path d="M12 11c-3 0-6 3.6-6 6.6C6 19.6 7.5 20 9 20c1.2 0 2-.6 3-.6s1.8.6 3 .6c1.5 0 3-.4 3-2.4 0-3-3-6.6-6-6.6z"/></svg><span>펫 도감 <b id="dexCnt"></b></span> <kbd>P</kbd></button>
      <button id="btnHome" class="ibtn" title="허브 섬으로 돌아가기 (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>집</span> <kbd>H</kbd></button>
      <button id="btnCp" class="ibtn" title="마지막 체크포인트로 (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg><span>체크포인트</span> <kbd>R</kbd></button>
      <button id="btnSound" class="ibtn" title="소리 켜기/끄기 (M)"><svg id="sndIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg><span>소리</span> <kbd>M</kbd></button>
      <button id="btnFb" class="ibtn" title="개발자에게 피드백 보내기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H10l-4 4v-4H4z"/><path d="M8 9.5h8M8 12.5h5"/></svg><span>피드백</span></button>
    </div>
  </div>

  <div id="hint" class="panel"><b>WASD</b> 이동 · <b>Space</b> 점프 · <b>드래그</b> 시점 · <b>F</b>/크리스탈 클릭 채굴 · <b>클릭</b>/<b>J</b> 공격 · <b>Shift</b> 시프트락 · <b>P</b> 펫 도감</div>

  <div id="hpBar" class="hidden"><span>HP</span><div class="hpTrack"><i id="hpFill"></i></div><b id="hpTxt">100 / 100</b></div>
  <div id="bossBar" class="panel hidden"><div class="bbHead"><span id="bossName">보스</span><b id="bossTime">180초</b></div><div class="bbTrack"><i id="bossHpFill"></i></div><div id="bossHpTxt"></div></div>
  <div id="hurt"></div>
  <div id="xhair" aria-hidden="true"><svg viewBox="0 0 26 26"><path d="M13 2v6M13 18v6M2 13h6M18 13h6" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="4" stroke-linecap="round"/><path d="M13 2v6M13 18v6M2 13h6M18 13h6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="13" cy="13" r="2.2" fill="#fff" stroke="rgba(0,0,0,.55)" stroke-width="1"/></svg></div>

  <div id="zoneBanner"><div class="zb1" id="zb1"></div><div class="zb2" id="zb2"></div><div class="zb3" id="zb3"></div></div>
  <div id="goldArrow" class="hidden"><div id="goldPtr"></div><span id="goldTxt"></span></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="floaters"></div>

  <div id="touch">
    <div id="joyBase"><div id="joyKnob"></div></div>
    <button id="btnJump" aria-label="점프">점프</button>
    <button id="btnAtk" aria-label="공격">공격</button>
    <button id="btnSL" aria-label="시프트락" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><small>시프트락</small></button>
  </div>
  <button id="btnMine" aria-label="채굴하기"><span class="gem"></span><b>채굴</b><small id="mineVal">+1</small></button>
</div>

<aside id="shop" class="hidden" aria-label="상점">
  <header>
    <h2 id="shopTitle">상점</h2>
    <div class="coinMini"><span class="coinIco"></span><span id="shopCoins">0</span><span class="gemIco big"></span><span id="shopGems">0</span></div>
    <button id="shopClose" aria-label="상점 닫기">×</button>
  </header>
  <nav id="tabs"></nav>
  <div id="tabBody"></div>
</aside>

<div id="modal" class="hidden" role="dialog" aria-modal="true"><div class="mcard"><h3 id="mTitle"></h3><div id="mBody"></div><div id="mBtns"></div></div></div>

<div id="hatch" class="hidden" role="dialog" aria-modal="true" aria-label="펫 뽑기"><div id="hFlash"></div><div class="hHead"><h3 id="hTitle"></h3><p id="hSub"></p></div><div id="hStage"></div><div id="hBtns"></div><div id="hOdds"></div></div>

<div id="loading"><div><h1>쿠크다스의 모험</h1><p id="loadMsg">섬을 띄우는 중…</p></div></div>

<script>
  setTimeout(function () {
    if (!window.__gameStarted) {
      var m = document.getElementById('loadMsg');
      if (m) m.textContent = '3D 엔진을 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.';
    }
  }, 20000);
</script>
<script>window.VER = '1.7';</script>
<script type="module">
// three.js를 불러온 뒤 게임 스크립트를 순서대로 실행해요.
// (여러 파일이 같은 전역 공간을 쓰므로 순서가 중요해요. 맵 파일은 js/maps/ 아래)
import * as THREE from 'three';
window.THREE = THREE;
const FILES = [
  'js/core.js',
  'js/economy.js',
  'js/world/common.js',
  'js/maps/zones.js',
  'js/world/props.js',
  'js/maps/hub.js',
  'js/world/course-check.js',
  'js/maps/tower-daily.js',
  'js/player.js',
  'js/game.js',
  'js/ui.js',
  'js/systems.js',
  'js/combat.js',
  'js/maps/hunt.js',
  'js/combat-run.js',
  'js/fx.js',
  'js/world-fx.js',
  'js/pets.js',
  'js/maps/hatchery.js',
  'js/pets-gacha.js',
  'js/gfx.js',
  'js/map-manager.js',
  'js/main.js'
];
let last;
for (const f of FILES) {
  const s = document.createElement('script');
  s.src = f + '?v=' + window.VER;
  s.async = false; // 내려받기는 동시에, 실행은 순서대로
  s.onerror = () => { const m = document.getElementById('loadMsg'); if (m) m.textContent = '게임 파일(' + f + ')을 불러오지 못했어요. 새로고침해 주세요.'; };
  document.body.appendChild(s);
}
</script>
</body>
</html>
