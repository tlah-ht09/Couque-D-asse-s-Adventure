<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>쿠크다스의 모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  /* 한 가지 세계관: 해 질 녘 하늘섬. 짙은 남색 유리 패널 + 금화색 강조, 민트=수입, 코랄=경고 */
  --ink: #ffffff;
  --muted: #b3bfdd;
  --panel: rgba(16, 22, 44, 0.78);
  --panel-solid: #161d38;
  --panel-2: #222b50;
  --line: rgba(255, 255, 255, 0.13);
  --gold: #ffcf3f;
  --gold-deep: #e59a12;
  --mint: #3ee6a5;
  --sky: #5ab8ff;
  --coral: #ff6b5b;
  --font: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #8cc8f5; color: var(--ink); font-family: var(--font); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.hidden { display: none !important; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 6px 20px rgba(5, 10, 30, 0.25); }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#hud > * { pointer-events: auto; }
#leftCol { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); width: 300px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
#stats { padding: 10px 16px 12px; pointer-events: none; }
.coinRow { display: flex; align-items: center; gap: 10px; }
.coinIco { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0 0 18%, var(--gold) 40%, var(--gold-deep) 100%); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), 0 0 0 2px rgba(255,207,63,.35); flex: none; }
#coins { font-size: 30px; line-height: 1.1; color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.25); font-variant-numeric: tabular-nums; }
.subRow { margin-top: 4px; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.subRow b { color: var(--mint); font-weight: normal; }
.subRow i { font-style: normal; color: #fff; }
.chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.chip { font-size: 13px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.1); color: #fff; white-space: nowrap; }
.chip.mult { background: rgba(62,230,165,.18); color: var(--mint); }
.chip.star { background: rgba(255,207,63,.16); color: var(--gold); }
.chip.reb { background: rgba(199,125,255,.2); color: #e2c2ff; }

.gemIco { display: inline-block; width: 11px; height: 12px; margin-right: 4px; vertical-align: -1px; background: linear-gradient(160deg, #e6fdff, #7af0ff 45%, #2fb4e6); clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%); }
.gemIco.big { width: 16px; height: 17px; margin: 0 2px 0 10px; }
.chip.gem { background: rgba(122,240,255,.16); color: #b9f7ff; font-variant-numeric: tabular-nums; }
.chip.buff { background: rgba(255,207,63,.24); color: #ffe08a; animation: pulse 1.2s ease-in-out infinite; }
.chip.buff.boost { background: rgba(122,240,255,.2); color: #b9f7ff; animation: none; }
.chip.buff.click { background: rgba(90,184,255,.26); color: #cfe9ff; }
@keyframes pulse { 50% { opacity: .7; } }
#goldArrow { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; z-index: 6; }
#goldPtr { width: 26px; height: 22px; background: var(--gold); clip-path: polygon(50% 0, 100% 100%, 0 100%); filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
#goldTxt { font-size: 13px; padding: 2px 9px; border-radius: 99px; background: rgba(16,22,44,.85); color: var(--gold); white-space: nowrap; }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.skin { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); text-align: left; font-size: 14px; }
.skin i { width: 100%; height: 8px; border-radius: 4px; display: block; }
.skin small { color: var(--muted); font-size: 12px; }
.skin.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.skin.on small { color: var(--gold); }
.skin:disabled { opacity: .5; cursor: not-allowed; }
.row .nm em { color: var(--gold); font-style: normal; font-size: 13px; }
#quest { padding: 10px 14px 12px; pointer-events: none; }
.qhead { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
.qlabel { color: var(--gold); letter-spacing: .04em; }
#qtext { font-size: 16px; margin: 4px 0 8px; line-height: 1.35; text-wrap: balance; }
.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--mint), #9ff3d0); border-radius: 99px; transition: width .25s; }
#qreward { font-size: 12px; color: var(--muted); margin-top: 6px; }
#quest.done { box-shadow: 0 0 0 2px var(--mint), 0 6px 24px rgba(62,230,165,.35); }

#timer { position: absolute; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); padding: 6px 16px; display: flex; gap: 10px; align-items: baseline; pointer-events: none; }
#timer span { color: var(--muted); font-size: 14px; }
#timer b { font-weight: normal; font-size: 24px; color: #fff; font-variant-numeric: tabular-nums; min-width: 84px; text-align: right; }

#side { position: absolute; right: max(14px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
#minimap { width: 160px; height: 160px; border-radius: 50%; border: 3px solid rgba(255,255,255,.75); background: rgba(16,22,44,.6); box-shadow: 0 6px 18px rgba(5,10,30,.3); pointer-events: none; }
#sideBtns { display: grid; grid-template-columns: repeat(2, auto); gap: 8px; }
.ibtn { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 15px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: transform .08s, background .15s; }
.ibtn:hover { background: var(--panel-2); }
.ibtn:active { transform: scale(.95); }
.ibtn svg { width: 18px; height: 18px; flex: none; }
.ibtn kbd { font-family: inherit; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }
#btnShop { background: linear-gradient(180deg, #ffd85c, #f0a91b); color: #3a2400; border-color: rgba(0,0,0,.1); grid-column: span 2; justify-content: center; font-size: 17px; }
#btnShop kbd { color: #6b4700; border-color: rgba(0,0,0,.2); }

#hint { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); padding: 8px 12px; font-size: 13px; color: var(--muted); max-width: 520px; line-height: 1.5; pointer-events: none; }
#hint b { color: #fff; font-weight: normal; }

#btnMine { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 118px; height: 118px; border-radius: 50%; border: 4px solid rgba(255,255,255,.85); background: radial-gradient(circle at 40% 30%, #9ff3ff, #36b6ff 55%, #2a63d8); box-shadow: 0 8px 0 #1d3f99, 0 14px 30px rgba(10,30,90,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,40,.35); transition: transform .06s, box-shadow .06s; touch-action: none; }
#btnMine b { font-weight: normal; font-size: 22px; }
#btnMine small { font-size: 13px; opacity: .95; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#btnMine .gem { width: 26px; height: 26px; background: #fff; clip-path: polygon(50% 0, 100% 38%, 80% 100%, 20% 100%, 0 38%); opacity: .95; }
#btnMine.press { transform: translateY(6px) scale(.97); box-shadow: 0 2px 0 #1d3f99, 0 6px 16px rgba(10,30,90,.45); }

#touch { position: absolute; inset: 0; pointer-events: none; }
#joyBase { position: absolute; left: 40px; bottom: 40px; width: 130px; height: 130px; border-radius: 50%; background: rgba(16,22,44,.35); border: 2px solid rgba(255,255,255,.45); pointer-events: none; opacity: .75; }
#joyKnob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 4px 10px rgba(0,0,0,.25); }
#btnJump { position: absolute; right: max(150px, calc(env(safe-area-inset-right) + 150px)); bottom: max(22px, env(safe-area-inset-bottom)); width: 92px; height: 92px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); background: radial-gradient(circle at 40% 30%, #a6ffd9, #22c98b 60%, #138a5f); box-shadow: 0 6px 0 #0d6446; font-size: 20px; color: #fff; text-shadow: 0 2px 0 rgba(0,40,20,.35); pointer-events: auto; touch-action: none; }
#btnJump.press { transform: translateY(5px); box-shadow: 0 1px 0 #0d6446; }
body:not(.touch) #touch { display: none; }
body.touch #hint { display: none; }
body.touch #btnMine { width: 84px; height: 84px; bottom: max(132px, calc(env(safe-area-inset-bottom) + 132px)); right: max(26px, env(safe-area-inset-right)); }
body.touch #btnMine b { font-size: 18px; }
body.touch #btnMine .gem { width: 20px; height: 20px; }
body.touch .ibtn kbd { display: none; }

#hpBar { position: absolute; left: 50%; bottom: max(84px, calc(env(safe-area-inset-bottom) + 84px)); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-radius: 14px; background: rgba(16,22,44,.82); border: 1px solid var(--line); pointer-events: none; font-size: 14px; }
#hpBar span { color: #ff8fab; }
#hpBar b { font-weight: normal; font-variant-numeric: tabular-nums; min-width: 96px; text-align: right; }
.hpTrack { width: 200px; height: 12px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.hpTrack i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff5a5f, #ff8fab); transition: width .15s; }
#bossBar { position: absolute; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); width: min(520px, calc(100vw - 520px)); min-width: 280px; padding: 10px 16px 12px; pointer-events: none; }
.bbHead { display: flex; justify-content: space-between; font-size: 17px; margin-bottom: 6px; }
.bbHead b { font-weight: normal; color: var(--gold); font-variant-numeric: tabular-nums; }
.bbTrack { height: 14px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.bbTrack i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #c0392b, #ff6b5b); transition: width .12s; }
#bossHpTxt { font-size: 12px; color: var(--muted); margin-top: 4px; text-align: right; font-variant-numeric: tabular-nums; }
#hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 140px 30px rgba(255,40,40,.65); }
#hurt.on { animation: hurt .45s ease-out; }
@keyframes hurt { from { opacity: 1; } to { opacity: 0; } }
.floater.dmg { color: #ffffff; font-size: 20px; text-shadow: 0 2px 0 rgba(0,0,0,.5); }
.floater.crit { color: var(--gold); font-size: 30px; }
.floater.hurtTxt { color: #ff6b5b; font-size: 22px; }
#btnAtk { position: absolute; right: max(22px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); width: 92px; height: 92px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); background: radial-gradient(circle at 40% 30%, #ffb3a8, #ff6b5b 60%, #c0392b); box-shadow: 0 6px 0 #8e2a20; font-size: 20px; color: #fff; text-shadow: 0 2px 0 rgba(60,0,0,.35); pointer-events: auto; touch-action: none; }
#btnAtk.press { transform: translateY(5px); box-shadow: 0 1px 0 #8e2a20; }
body.touch #hpBar { bottom: max(250px, calc(env(safe-area-inset-bottom) + 250px)); }
#zoneBanner { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(.96); text-align: center; pointer-events: none; opacity: 0; transition: opacity .35s, transform .35s; padding: 14px 30px 16px; border-radius: 22px; background: rgba(16,22,44,.78); border: 1px solid var(--line); box-shadow: 0 12px 40px rgba(5,10,30,.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); max-width: calc(100vw - 32px); }
#zoneBanner.show { transform: translate(-50%, -50%) scale(1); }
#zoneBanner.show { opacity: 1; }
#zoneBanner .zb1 { font-size: 15px; color: var(--muted); letter-spacing: .06em; }
#zoneBanner .zb2 { font-size: 40px; color: #fff; text-wrap: balance; }
#zoneBanner .zb3 { font-size: 18px; color: var(--gold); margin-top: 4px; }

#toasts { position: absolute; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 8px; pointer-events: none; width: min(92vw, 460px); }
.toast { padding: 9px 16px; border-radius: 12px; background: var(--panel-solid); border: 1px solid var(--line); font-size: 15px; box-shadow: 0 6px 18px rgba(5,10,30,.35); animation: tin .25s ease-out; text-align: center; }
.toast.good { border-color: rgba(62,230,165,.6); }
.toast.bad { border-color: rgba(255,107,91,.7); }
.toast.gold { border-color: rgba(255,207,63,.7); color: var(--gold); }
.toast.out { opacity: 0; transform: translateY(6px); transition: all .3s; }
@keyframes tin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
body.touch #toasts { bottom: max(240px, calc(env(safe-area-inset-bottom) + 240px)); }

#floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.floater { position: absolute; font-size: 22px; color: var(--gold); text-shadow: 0 2px 0 rgba(60,30,0,.55), 0 0 10px rgba(0,0,0,.25); white-space: nowrap; will-change: transform, opacity; }
.floater.mint { color: var(--mint); }
.floater.big { font-size: 30px; }

/* ---------- 상점 ---------- */
#shop { position: fixed; right: 0; top: 0; bottom: 0; width: min(440px, 100vw); background: var(--panel-solid); border-left: 1px solid var(--line); z-index: 20; display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0,0,0,.35); animation: sin .22s ease-out; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
@keyframes sin { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
#shop header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
#shop h2 { margin: 0; font-weight: normal; font-size: 24px; text-wrap: balance; }
#shop header .coinMini { color: var(--gold); font-size: 18px; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
#shop header .coinMini .coinIco { width: 18px; height: 18px; }
#shopClose { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); font-size: 22px; line-height: 1; }
#tabs { display: flex; gap: 6px; padding: 6px 16px 10px; overflow-x: auto; scrollbar-width: none; flex: none; }
#tabs::-webkit-scrollbar { display: none; }
#tabs button { flex: none; padding: 8px 13px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 15px; }
#tabs button.on { background: var(--gold); color: #3a2400; border-color: transparent; }
#tabBody { flex: 1; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 10px; touch-action: pan-y; }
.row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.row .sw { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; color: #1a1a2e; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); }
.row .nm { font-size: 17px; }
.row .nm small { color: var(--muted); font-size: 13px; margin-left: 4px; }
.row .ds { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.row .ds b { color: var(--mint); font-weight: normal; }
.row .ds em { color: var(--gold); font-style: normal; }
.row.locked { opacity: .55; }
.buy { min-width: 98px; padding: 9px 10px; border-radius: 11px; border: none; background: var(--mint); color: #053c27; font-size: 14px; line-height: 1.25; box-shadow: 0 3px 0 #1d9b6d; text-align: center; }
.buy:disabled { background: #3a4466; color: #93a0c3; box-shadow: 0 3px 0 #283152; cursor: not-allowed; }
.buy.alt { background: var(--sky); color: #06264a; box-shadow: 0 3px 0 #2a7ac0; }
.buy.done { background: transparent; color: var(--mint); box-shadow: none; border: 1px solid rgba(62,230,165,.4); }
.buy:not(:disabled):active { transform: translateY(2px); box-shadow: 0 1px 0 #1d9b6d; }
.seg { display: flex; gap: 6px; align-items: center; justify-content: space-between; font-size: 14px; color: var(--muted); }
.seg div { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 10px; }
.seg button { border: none; background: transparent; color: var(--muted); padding: 5px 12px; border-radius: 8px; font-size: 14px; }
.seg button.on { background: #fff; color: #1a1f3a; }
.card { padding: 14px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); font-size: 15px; line-height: 1.55; }
.card h4 { margin: 0 0 6px; font-weight: normal; font-size: 18px; color: var(--gold); }
.card p { margin: 0 0 6px; color: var(--muted); }
.card ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); }
.big { font-size: 34px; color: #e2c2ff; }
.wide { width: 100%; padding: 13px; font-size: 17px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 15px; }
.kv span:nth-child(odd) { color: var(--muted); }
.kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.lb { display: grid; grid-template-columns: 26px 1fr auto; gap: 4px 10px; font-size: 15px; margin-top: 6px; }
.lb .me { color: var(--gold); }
.lb span:nth-child(3n+1) { color: var(--muted); text-align: right; }
.lb span:nth-child(3n) { font-variant-numeric: tabular-nums; }
textarea { width: 100%; min-height: 70px; border-radius: 10px; background: #0e1430; color: #fff; border: 1px solid var(--line); padding: 8px; font-size: 12px; font-family: ui-monospace, monospace; -webkit-user-select: text; user-select: text; touch-action: auto; }
input[type=range] { width: 100%; accent-color: var(--gold); touch-action: auto; }
.btnRow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.btnRow .buy { flex: 1; }
.danger { background: var(--coral) !important; color: #3d0700 !important; box-shadow: 0 3px 0 #b8392c !important; }

/* ---------- 모달 ---------- */
#modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(6, 10, 26, .55); padding: 16px; }
.mcard { width: min(440px, 100%); max-height: calc(100% - 20px); overflow-y: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 20px; padding: 22px 22px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.45); animation: pop .22s cubic-bezier(.2,1.4,.4,1); touch-action: pan-y; }
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
.mcard h3 { margin: 0 0 10px; font-weight: normal; font-size: 26px; color: var(--gold); text-wrap: balance; }
#mBody { font-size: 16px; line-height: 1.6; color: #dfe6ff; }
#mBody p { margin: 0 0 10px; }
#mBody .ctl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 10px 0; font-size: 15px; }
#mBody .ctl kbd { font-family: inherit; background: #2b355f; border-radius: 6px; padding: 1px 7px; color: #fff; white-space: nowrap; }
#mBody .ctl span { color: var(--muted); }
#mBody .hl { color: var(--gold); }
#mBody .ml { color: var(--mint); }
#mBtns { display: flex; gap: 8px; margin-top: 16px; }
#mBtns .buy { flex: 1; padding: 12px; font-size: 17px; }
#mBtns { flex-wrap: wrap; }
a.buy { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
/* ---------- 피드백 ---------- */
.fbSeg { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 12px; }
.fbSeg button { flex: 1 1 auto; min-height: 40px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); font-size: 15px; }
.fbSeg button.on { background: var(--gold); color: #3a2400; border-color: transparent; }
.fbL { display: block; font-size: 14px; color: var(--muted); margin: 0 0 4px; }
#mBody textarea.fbTa { min-height: 120px; font-family: inherit; font-size: 16px; line-height: 1.5; resize: vertical; }

const canvas = $('c');

{

// ---------- 하늘 ----------
const skyUni = {

const sky = new THREE.Mesh(

  new THREE.ShaderMaterial({

sky.renderOrder = -10;
scene.add(sky);

const starField = (() => {
  const n = 900, pos = new Float32Array(n * 3);

    const u = Math.random() * TAU, v = Math.acos(rand(-0.2, 1));

  const g = new THREE.BufferGeometry();

  scene.add(p);

})();

// =====================================================================
//  재질 / 지오메트리 / 메시 헬퍼
// =====================================================================
const matCache = new Map();
function mat(color, o = null) {
  const key = color + (o ? JSON.stringify(o) : '');

const G = {
  box: new THREE.BoxGeometry(1, 1, 1),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 28),
  cyl8: new THREE.CylinderGeometry(1, 1, 1, 8),

function mesh(geo, material, x, y, z, sx = 1, sy = 1, sz = 1, parent = scene, cast = true, recv = true) {

  m.position.set(x, y, z);

  m.castShadow = cast;
  m.receiveShadow = recv;

}

// =====================================================================
//  충돌체 (AABB 박스 / 수직 원기둥)
// =====================================================================
const colliders = [];
let colSeq = 0;
function addBoxCol(x, y, z, hx, hy, hz, flags) {
  const c = Object.assign({ id: colSeq++, t: 'b', x, y, z, hx, hy, hz, solid: true, dx: 0, dy: 0, dz: 0 }, flags || {});

}

  colliders.push(c);

}

  const m = mesh(G.box, material, x, top - sy / 2, z, sx, sy, sz);

}

// =====================================================================
//  캔버스 라벨 스프라이트
// =====================================================================
const FONT = '"Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';
const labels = [];
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function makeLabel(lines, opt = {}) {
  const cv = document.createElement('canvas');
  cv.width = opt.w || 512; cv.height = opt.h || 256;
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;

  const sizes = items.map((it, i) => it.s || (i === 0 ? 46 : 38));
  const gap = 10;
  const totalH = sizes.reduce((a, b) => a + b, 0) + gap * (items.length - 1);
  let maxW = 0;
  items.forEach((it, i) => { c.font = sizes[i] + 'px ' + FONT; maxW = Math.max(maxW, c.measureText(it.t).width); });
  const bw = Math.min(cv.width - 8, maxW + 56), bh = Math.min(cv.height - 8, totalH + 34);
  const bx = (cv.width - bw) / 2, by = (cv.height - bh) / 2;
  if (!opt.noBg) {
    roundRect(c, bx, by, bw, bh, 26);
    c.fillStyle = opt.bg || 'rgba(16,22,44,0.82)';
    c.fill();
    c.lineWidth = 5;
    c.strokeStyle = opt.accent || 'rgba(255,255,255,0.35)';
    c.stroke();
  }
  let y = (cv.height - totalH) / 2;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  items.forEach((it, i) => {
    c.font = sizes[i] + 'px ' + FONT;
    if (opt.noBg) { c.lineWidth = 8; c.strokeStyle = 'rgba(16,22,44,0.7)'; c.strokeText(it.t, cv.width / 2, y + sizes[i] / 2 + 2); }

// =====================================================================
const PMAX = 360;
const pMesh = new THREE.InstancedMesh(G.box, new THREE.MeshBasicMaterial({ color: 0xffffff }), PMAX);

const parts = [];
const _dummy = new THREE.Object3D();

function burst(x, y, z, color, n = 12, speed = 5, size = 0.18, up = 3, grav = 1, life = 0.9) {

    const p = parts[pIdx];

function island(x, top, z, r, th, flags) {
  const g = new THREE.Group();
  g.position.set(x, top, z);
  scene.add(g);
  mesh(G.cyl, mat(th.grass), 0, -0.6, 0, r, 1.2, r, g);
  mesh(G.cyl, mat(th.dirt), 0, -2.0, 0, r * 0.97, 1.6, r * 0.97, g, true, false);
  const cone = mesh(G.cone16, mat(th.dirt2), 0, -2.8 - r * 0.45, 0, r * 0.93, r * 0.9, r * 0.93, g, true, false);
  cone.rotation.x = Math.PI;
  for (let i = 0; i < Math.round(r / 3); i++) {
    const a = Math.random() * TAU, rr = r * rand(0.3, 0.8);
    const rock = mesh(G.dodec, mat(th.dirt2), Math.cos(a) * rr, -3 - r * rand(0.2, 0.6), Math.sin(a) * rr, rand(0.8, 2), rand(1, 2.5), rand(0.8, 2), g, false, false);
    rock.rotation.set(Math.random(), Math.random(), Math.random());
  }
  const c = addCylCol(x, top - 1.5, z, r, 1.5, Object.assign({ island: true }, flags || {}));
  islands.push({ x, z, y: top, r, color: th.grass });
  return c;
}

function tree(x, top, z, s = 1, leaf = 0x4fbf5a, kind = 'round') {
  mesh(G.cyl8, mat(0x8b5a2b), x, top + 0.9 * s, z, 0.28 * s, 1.8 * s, 0.28 * s);
  if (kind === 'pine') {
    mesh(G.cone, mat(leaf), x, top + 2.3 * s, z, 1.35 * s, 1.9 * s, 1.35 * s);
    mesh(G.cone, mat(leaf), x, top + 3.4 * s, z, 1.0 * s, 1.6 * s, 1.0 * s);
    mesh(G.cone, mat(0xffffff), x, top + 4.15 * s, z, 0.45 * s, 0.6 * s, 0.45 * s);
  } else {
    const b = mesh(G.ico, mat(leaf), x, top + 2.6 * s, z, 1.45 * s, 1.3 * s, 1.45 * s);
    b.rotation.y = Math.random() * 3;
    mesh(G.ico, mat(leaf), x + 0.6 * s, top + 3.3 * s, z - 0.3 * s, 0.8 * s, 0.8 * s, 0.8 * s);
  }
  addCylCol(x, top + 1.5 * s, z, 0.35 * s, 1.5 * s);
}
function rock(x, top, z, s, color) {
  const m = mesh(G.dodec, mat(color), x, top + s * 0.35, z, s, s * 0.7, s * 0.9);
  m.rotation.y = Math.random() * 3;
  if (s > 0.7) addCylCol(x, top + s * 0.35, z, s * 0.8, s * 0.35 + 0.01);
}

function themeMat(zid, idx) {
  const th = THEMES[zid];

const starGeo = (() => {
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 0.45 : 1, a = (i / 10) * TAU + Math.PI / 2;
    if (i) s.lineTo(Math.cos(a) * r, Math.sin(a) * r); else s.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.28, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.07, bevelSegments: 1 });
  g.center();
  return g;
})();
const starMat = new THREE.MeshStandardMaterial({ color: 0xffd23f, emissive: 0xffa800, emissiveIntensity: 0.75, roughness: 0.35, metalness: 0.3, flatShading: true });
function glowTex(inner, outer) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const c = cv.getContext('2d');
  const gr = c.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, inner); gr.addColorStop(0.35, outer); gr.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = gr; c.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const starGlowMat = new THREE.SpriteMaterial({ map: glowTex('rgba(255,240,170,0.9)', 'rgba(255,200,60,0.35)'), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
function addStar(x, y, z, zone) {
  const id = (zone === 0 ? 'h' : 'z' + zone + '-') + stars.filter((s) => s.zone === zone).length;
  const m = mesh(starGeo, starMat, x, y, z, 0.55, 0.55, 0.55, scene, true, false);
  const gl = new THREE.Sprite(starGlowMat);
  gl.scale.set(2.6, 2.6, 1);
  gl.position.set(x, y, z);
  scene.add(gl);
  stars.push({ id, x, y, z, zone, mesh: m, glow: gl, taken: false, ph: Math.random() * 6 });
}

// ---------- 플랫폼 ----------
function makePlatform(zid, kind, x, top, z, o) {
  const h = o.h || (kind === 'finish' ? 2 : 0.8);
  let material;
  const flags = { zone: zid };
  switch (kind) {
    case 'start': material = M.start; flags.start = zid; break;
    case 'cp': material = M.cp; flags.cp = true; break;
    case 'finish': material = M.finish; flags.finish = zid; break;
    case 'ice': material = M.ice; flags.ice = true; break;
    case 'bounce': material = M.bounce; flags.bounce = o.v || 20; break;
    case 'fade': material = new THREE.MeshStandardMaterial({ color: 0xffa94d, emissive: 0xff7a00, emissiveIntensity: 0.15, roughness: 0.7, flatShading: true, transparent: true, opacity: 0.95 }); material.userData.own = true; break;
    default: material = themeMat(zid, o.idx || 0);
  }
  const c = o.round ? cylPlat(x, top, z, o.r, h, material, flags) : boxPlat(x, top, z, o.sx, h, o.sz, material, flags);
  if (kind === 'fade') { c.fade = { st: 0, t: 0 }; fades.push(c); }
  if (kind === 'bounce') {
    const tp = o.round ? mesh(G.cyl, M.bounceTop, x, top + 0.08, z, o.r * 0.75, 0.16, o.r * 0.75) : mesh(G.box, M.bounceTop, x, top + 0.08, z, o.sx * 0.7, 0.16, o.sz * 0.7);
    tp.castShadow = false;
    c.deco = [tp];
  }
  if (kind === 'cp') {
    const px = x + (o.round ? o.r * 0.6 : o.sx / 2 - 0.4), pz = z + (o.round ? 0 : o.sz / 2 - 0.4);
    mesh(G.cyl8, M.pole, px, top + 1.4, pz, 0.08, 2.8, 0.08);
    const fm = new THREE.MeshStandardMaterial({ color: 0x8892b0, flatShading: true, side: THREE.DoubleSide, emissive: 0x000000 });
    fm.userData.own = true;
    const flag = mesh(G.box, fm, px + 0.55, top + 2.45, pz, 1.1, 0.7, 0.06);
    c.flag = flag;
  }
  if (kind === 'sweep') {
    const len = o.r - 0.25;
    const post = addCylCol(x, top + 0.8, z, 0.45, 0.8, { zone: zid });
    post.mesh = mesh(G.cyl, M.post, x, top + 0.8, z, 0.45, 1.6, 0.45);
    const g = new THREE.Group();
    g.position.set(x, top + 0.6, z);
    scene.add(g);
    mesh(G.box, M.sweep, 0, 0, 0, len * 2, 0.55, 0.42, g);
    mesh(G.cyl, M.post, 0, 0.35, 0, 0.6, 0.3, 0.6, g);
    sweepers.push({ x, z, y0: top + 0.28, y1: top + 0.92, len, ang: Math.random() * TAU, spd: o.spd || 1.8, g });
  }
  if (o.move) {
    const mv = o.move;
    c.move = { ax: mv.ax, ay: mv.ay, az: mv.az, amp: mv.amp, spd: mv.spd, ph: mv.ph || 0, ox: c.x, oy: c.y, oz: c.z };
    movers.push(c);
  }
  return c;
}

function decorateFinish(zid, c, fx, fz, lx, lz) {
  const cx = c.x, cz = c.z, top = c.top;
  const hs = Math.min(c.hx, c.hz);
  // 트로피
  const tx = cx + fx * (hs - 2.2), tz = cz + fz * (hs - 2.2);
  mesh(G.cyl, M.gold, tx, top + 0.25, tz, 0.9, 0.5, 0.9);
  mesh(G.cyl8, M.gold, tx, top + 0.9, tz, 0.22, 0.9, 0.22);
  const cup = mesh(G.cone16, M.gold, tx, top + 2.0, tz, 0.95, 1.4, 0.95);
  cup.rotation.x = Math.PI;
  const h1 = mesh(G.torus, M.gold, tx + lx * 0.95, top + 2.1, tz + lz * 0.95, 0.4, 0.4, 0.4);
  const h2 = mesh(G.torus, M.gold, tx - lx * 0.95, top + 2.1, tz - lz * 0.95, 0.4, 0.4, 0.4);
  h1.rotation.y = h2.rotation.y = Math.atan2(lx, lz) + Math.PI / 2;
  addCylCol(tx, top + 1.3, tz, 0.95, 1.3, { zone: zid });
  const lab = makeLabel([{ t: zoneById(zid).course + ' 완주 지점', c: '#ffcf3f' }, '최고 기록 없음'], { sx: 4.2, pos: new THREE.Vector3(tx, top + 4.2, tz), accent: 'rgba(255,207,63,.7)' });
  courses[zid].trophyLabel = lab;
  // 귀환 포털
  const px = cx + lx * (hs - 2), pz = cz + lz * (hs - 2);
  addPortal(px, top, pz, zid, Math.atan2(fx, fz));
  // 별 탑 (계단 블록)
  for (let k = 0; k < 3; k++) {
    const bx = cx - lx * (hs - 1.4) + fx * (k * 1.6 - 1.6), bz = cz - lz * (hs - 1.4) + fz * (k * 1.6 - 1.6);
    boxPlat(bx, top + 1.2 * (k + 1), bz, 1.5, 1.2 * (k + 1), 1.5, themeMat(zid === 5 ? 5 : zid, k + 1), { zone: zid });
    if (k === 2) addStar(bx, top + 1.2 * 3 + 1.5, bz, zid);
  }
}

function addPortal(x, top, z, zid, rotY = 0) {
  const c = cylPlat(x, top + 0.25, z, 1.3, 0.25, M.portal, { portal: true, zone: zid });
  const ring = mesh(G.torus, M.portal, x, top + 1.9, z, 1.35, 1.35, 1.35, scene, false, false);
  ring.rotation.y = rotY;
  const disc = new THREE.Mesh(new THREE.CircleGeometry(1.25, 24), new THREE.MeshBasicMaterial({ color: 0x9ff3ff, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }));
  disc.position.set(x, top + 1.9, z);
  disc.rotation.y = rotY;
  scene.add(disc);
  portals.push({ ring, disc, x, y: top, z });
  makeLabel([{ t: '허브로 귀환', c: '#9ff3ff' }], { w: 256, h: 96, sx: 2.6, pos: new THREE.Vector3(x, top + 3.7, z), noBg: true });
  return c;
}

// ---------- 코스 빌더 ----------
function moveVec(mv, fx, fz, lx, lz) {
  const a = mv.a;
  const v = a === 'l' ? [lx, 0, lz] : a === 'f' ? [fx, 0, fz] : [0, 1, 0];
  return { ax: v[0], ay: v[1], az: v[2], amp: mv.amp, spd: mv.spd, ph: mv.ph || 0 };
}

function buildCourse(zid, O, dir, startF, steps, entryCol, gs = 1) {
  const fx = dir[0], fz = dir[1], lx = -fz, lz = fx;
  const W = (F, L) => [O.x + fx * F + lx * L, O.z + fz * F + lz * L];
  const alongZ = fx === 0;
  const C = courses[zid] = { zid, pairs: [], gs, nodes: [] };
  let prev = { F: startF, L: 0, top: O.y, d: 0, amp: 0 };
  let last = entryCol;
  steps.forEach((s, i) => {
    const kind = s.t || 'n';
    const round = kind === 'cyl' || kind === 'sweep';
    const r = s.r || 1.5;
    const w = round ? 2 * r : (s.w || 3), d = round ? 2 * r : (s.d || 3);
    const ampF = s.move && s.move.a === 'f' ? s.move.amp : 0;
    const F = prev.F + prev.d / 2 + prev.amp + (s.g == null ? 3 : s.g) + ampF + d / 2;
    const L = prev.L + (s.l || 0);
    const top = prev.top + (s.y || 0);
    const [x, z] = W(F, L);
    const c = makePlatform(zid, kind, x, top, z, {
      round, r, sx: alongZ ? w : d, sz: alongZ ? d : w, h: s.h, idx: i, v: s.v, spd: s.spd,
      move: s.move && moveVec(s.move, fx, fz, lx, lz),
    });
    C.nodes.push(c);
    C.pairs.push([last, c]);
    last = c;
    if (kind === 'start') { C.start = c; makeLabel([{ t: zoneById(zid).course, c: '#ffffff' }, { t: '여기서 시작', c: '#ffcf3f', s: 34 }], { sx: 3.6, pos: new THREE.Vector3(x, top + 3, z), noBg: true }); }
    if (kind === 'finish') { C.finish = c; }
    if (s.star) addStar(x, top + 1.5, z, zid);
    if (s.side) {
      const sd = s.side;
      const [x2, z2] = W(F + (sd.f || 0), L + sd.l);
      const sc = makePlatform(zid, sd.t || 'n', x2, top + (sd.y || 0), z2, {
        sx: alongZ ? (sd.w || 2) : (sd.d || 2), sz: alongZ ? (sd.d || 2) : (sd.w || 2), idx: i + 2,
        move: sd.move && moveVec(sd.move, fx, fz, lx, lz),
      });
      C.pairs.push([c, sc]);
      if (sd.star) addStar(x2, top + (sd.y || 0) + 1.5, z2, zid);
    }
    if (s.hazard === 'stripes') {
      for (const [fo, l0, l1] of [[-d / 4, -w / 2, w / 2 - 2.2], [d / 4, -w / 2 + 2.2, w / 2]]) {
        const lm = (l0 + l1) / 2, lw = l1 - l0;
        const [bx, bz] = W(F + fo, L + lm);
        boxPlat(bx, top + 0.35, bz, alongZ ? lw : 1, 0.36, alongZ ? 1 : lw, M.lava, { kill: true, zone: zid });
      }
    }
    if (kind === 'finish') decorateFinish(zid, c, fx, fz, lx, lz);
    prev = { F, L, top, d, amp: ampF };
  });
  return C;
}

    { t: 'sweep', g: 5, r: 4.5, spd: -2.6 },
    { t: 'cyl', g: 7, r: 1.2, y: 2, side: { l: -8, y: 4, w: 1.6, d: 1.6, star: true } },

// ---------- 구름 탑 (4구역) ----------
function buildTower(zid, O, dir, entryCol) {
  const fx = dir[0], fz = dir[1], lx = -fz, lz = fx;
  const W = (F, L) => [O.x + fx * F + lx * L, O.z + fz * F + lz * L];
  const alongZ = fx === 0;
  const C = courses[zid] = { zid, pairs: [], gs: 1, nodes: [] };
  let [x, z] = W(15.5, 0);
  const s0 = makePlatform(zid, 'start', x, 0, z, { sx: alongZ ? 4 : 3, sz: alongZ ? 3 : 4 });
  C.start = s0;
  C.pairs.push([entryCol, s0]);
  makeLabel([{ t: zoneById(zid).course, c: '#ffffff' }, { t: '여기서 시작', c: '#ffcf3f', s: 34 }], { sx: 3.6, pos: new THREE.Vector3(x, 3, z), noBg: true });
  [x, z] = W(21, 0);
  const s1 = makePlatform(zid, 'n', x, 0, z, { sx: 3, sz: 3, idx: 1 });
  C.pairs.push([s0, s1]);
  const [cx, cz] = W(30, 0);
  const base = cylPlat(cx, 0, cz, 5, 1, themeMat(zid, 0), { zone: zid });
  C.pairs.push([s1, base]);
  const pillar = cylPlat(cx, 41.5, cz, 3, 42.5, mat(0xf5f0ff), { zone: zid });
  for (let y = 4; y < 41; y += 6) mesh(G.cyl, mat(0xd8ccff), cx, y, cz, 3.08, 0.5, 3.08, scene, false, true);
  let last = base;
  const RADIUS = 8, N = 33;
  for (let k = 0; k < N; k++) {
    const phi = (k * 50) * Math.PI / 180;
    const F = 30 + RADIUS * Math.sin(phi), L = RADIUS * Math.cos(phi);
    const [px, pz] = W(F, L);
    const top = 1.3 + 1.25 * k;
    const isCp = k === 8 || k === 16 || k === 24;
    const isFade = [5, 6, 13, 14, 20, 21, 28, 29].includes(k);
    const isMove = [10, 18, 26].includes(k);
    const kind = isCp ? 'cp' : isFade ? 'fade' : 'cyl';
    const c = makePlatform(zid, kind, px, top, pz, { round: true, r: isCp ? 2.3 : 1.8, h: 0.7, idx: k, move: isMove ? { ax: 0, ay: 1, az: 0, amp: 0.8, spd: 1.6 } : null });
    C.nodes.push(c);
    C.pairs.push([last, c]);
    last = c;
    if (k === 3) addStar(px, top + 1.5, pz, zid);
    if (k === 12 || k === 22) {
      const [sx, sz] = W(30 + 12.5 * Math.sin(phi), 12.5 * Math.cos(phi));
      const sc = makePlatform(zid, 'cyl', sx, top + 1, sz, { round: true, r: 1.3, h: 0.6, idx: k + 1 });
      C.pairs.push([c, sc]);
      addStar(sx, top + 2.5, sz, zid);
    }
  }
  const fin = makePlatform(zid, 'finish', cx, 42.5, cz, { round: true, r: 5.5, h: 1 });
  C.finish = fin;
  C.pairs.push([last, fin]);
  // 완주 장식 (원형 플랫폼용)
  const hs = 3.9;
  const fc = { x: cx, z: cz, top: 42.5, hx: hs, hz: hs };
  decorateFinish(zid, fc, fx, fz, lx, lz);
  return C;
}

// ---------- 섬 장식 ----------
function decorate(zid, x, top, z, r) {
  const ring = (n, r0, r1, fn) => {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + rand(-0.2, 0.2), rr = rand(r0, r1);
      fn(x + Math.cos(a) * rr, z + Math.sin(a) * rr, a);
    }
  };
  if (zid === 1) {
    ring(6, r * 0.55, r * 0.85, (px, pz) => tree(px, top, pz, rand(0.85, 1.2), [0x4fbf5a, 0x63cf6a, 0x3fae55][Math.floor(Math.random() * 3)]));
    for (let i = 0; i < 26; i++) flowerSpots.push([x + rand(-r, r) * 0.8, top, z + rand(-r, r) * 0.8]);
  } else if (zid === 2) {
    ring(5, r * 0.5, r * 0.85, (px, pz) => rock(px, top, pz, rand(0.7, 1.5), 0x2a2024));
    const vx = x + rand(-3, 3), vz = z + rand(-3, 3);
    const v = mesh(G.cone16, mat(0x3a2d31), vx, top + 1.6, vz, 3, 3.2, 3);
    v.rotation.y = 0.3;
    mesh(G.cyl, M.lava, vx, top + 3.05, vz, 1.1, 0.2, 1.1, scene, false, false);
    addCylCol(vx, top + 1.2, vz, 2.4, 1.2, { zone: zid });
    spinners.push({ kind: 'smoke', x: vx, y: top + 3.3, z: vz });
  } else if (zid === 3) {
    ring(6, r * 0.5, r * 0.85, (px, pz) => tree(px, top, pz, rand(0.9, 1.25), 0x2e8b6a, 'pine'));
    ring(5, r * 0.3, r * 0.7, (px, pz) => {
      const m = mesh(G.oct, M.ice, px, top + 0.9, pz, 0.5, 1.4, 0.5);
      m.rotation.y = Math.random() * 3;
    });
  } else if (zid === 4) {
    ring(7, r * 0.6, r * 0.95, (px, pz) => {
      const g = new THREE.Group(); g.position.set(px, top + 0.6, pz); scene.add(g);
      for (let i = 0; i < 3; i++) mesh(G.ico1, M.cloud, rand(-0.8, 0.8), rand(0, 0.4), rand(-0.8, 0.8), rand(0.7, 1.1), rand(0.5, 0.8), rand(0.7, 1.1), g, false, false);
    });
  } else if (zid === 5) {
    ring(7, r * 0.5, r * 0.9, (px, pz) => {
      const col = [0x7c6cf0, 0x22d3c5, 0xfd79a8][Math.floor(Math.random() * 3)];
      for (let i = 0; i < 3; i++) {
        const m = mesh(G.oct, mat(col, { emissive: col, emissiveIntensity: 0.7 }), px + rand(-0.6, 0.6), top + 0.8, pz + rand(-0.6, 0.6), 0.35, rand(0.9, 1.6), 0.35);
        m.rotation.set(rand(-0.3, 0.3), Math.random() * 3, rand(-0.3, 0.3));
      }
    });
  }
}

const bridges = {};
function buildBridge(z) {
  const [fx, fz] = z.dir, lx = -fz, lz = fx;
  const r0 = HUB_R - 1.5, r1 = ENTRY_D - ENTRY_R + 1.5, len = r1 - r0;
  const alongX = fx !== 0;
  const g = new THREE.Group();
  g.position.set(fx * r0, 0, fz * r0);
  scene.add(g);
  const W = 4.4;
  mesh(G.box, M.wood, fx * len / 2, -0.3, fz * len / 2, alongX ? len : W, 0.6, alongX ? W : len, g);
  for (let s = 0.6; s < len; s += 1.5) mesh(G.box, M.woodDark, fx * s, 0.005, fz * s, alongX ? 0.12 : W - 0.2, 0.02, alongX ? W - 0.2 : 0.12, g, false, true);
  for (let s = 0.5; s <= len + 0.01; s += len / 6) {
    for (const sd of [-1, 1]) mesh(G.box, M.woodDark, fx * s + lx * sd * 2.05, 0.6, fz * s + lz * sd * 2.05, 0.26, 1.2, 0.26, g);
  }
  for (const sd of [-1, 1]) mesh(G.box, M.wood, fx * len / 2 + lx * sd * 2.05, 1.12, fz * len / 2 + lz * sd * 2.05, alongX ? len : 0.16, 0.14, alongX ? 0.16 : len, g);
  const cxw = fx * (r0 + len / 2), czw = fz * (r0 + len / 2);
  const deck = addBoxCol(cxw, -0.3, czw, alongX ? len / 2 : W / 2, 0.3, alongX ? W / 2 : len / 2, { bridge: z.id });
  const rails = [-1, 1].map((sd) => addBoxCol(cxw + lx * sd * 2.05, 0.6, czw + lz * sd * 2.05, alongX ? len / 2 : 0.12, 0.6, alongX ? 0.12 : len / 2, { bridge: z.id }));
  const ghost = mesh(G.box, ghostMat(0xffffff), cxw, -0.3, czw, alongX ? len : W, 0.6, alongX ? W : len, scene, false, false);
  // 구매 발판
  const pr = HUB_R - 5;
  const padMat = new THREE.MeshStandardMaterial({ color: 0x5c6788, flatShading: true, emissive: 0x000000 });
  const pad = cylPlat(fx * pr, 0.18, fz * pr, 1.35, 0.3, padMat, { bridgePad: z.id });
  const padLabel = makeLabel(['', ''], { sx: 3.8, pos: new THREE.Vector3(fx * pr, 2.9, fz * pr) });
  const sign = makeLabel([{ t: z.name, c: z.css }], { w: 384, h: 128, sx: 3.6, pos: new THREE.Vector3(fx * (r0 + 0.5) + lx * 3.4, 2.6, fz * (r0 + 0.5) + lz * 3.4) });
  bridges[z.id] = { g, deck, rails, ghost, pad, padMat, padLabel, sign, alongX, anim: 1 };
}

let launchPad = null;

const droppers = [];
const beltTex = (() => {
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 16;
  const c = cv.getContext('2d');
  c.fillStyle = '#2b2f45'; c.fillRect(0, 0, 64, 16);
  c.fillStyle = '#4a5070'; c.fillRect(0, 0, 20, 16);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(8, 1); t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const beltMat = new THREE.MeshStandardMaterial({ map: beltTex, roughness: 0.9, flatShading: true });
function buildDropper(i) {
  const gd = GENS[i];
  const a = (202.5 + 45 * i) * Math.PI / 180;
  const ca = Math.cos(a), sa = Math.sin(a);
  const R = 11.8, mx = ca * R, mz = sa * R;
  const real = new THREE.Group();
  real.position.set(mx, 0, mz);
  real.rotation.y = -a;
  scene.add(real);
  const tier = mat(gd.color, { metalness: 0.2, roughness: 0.6 });
  for (const [ox, oz] of [[0.7, 0.7], [0.7, -0.7], [-0.7, 0.7], [-0.7, -0.7]]) mesh(G.cyl8, mat(0x454b66), ox, 1.0, oz, 0.12, 2.0, 0.12, real);
  mesh(G.box, tier, 0, 2.65, 0, 1.9, 1.4, 1.9, real);
  mesh(G.box, mat(0x2b2f45), 0, 2.0, 0, 2.0, 0.18, 2.0, real);
  mesh(G.box, mat(0x2b2f45), 0, 3.35, 0, 2.0, 0.18, 2.0, real);
  const fun = mesh(G.cone16, mat(0x454b66), 0, 1.55, 0, 0.6, 0.75, 0.6, real);
  fun.rotation.x = Math.PI;
  const gem = mesh(G.oct, mat(gd.color, { emissive: gd.color, emissiveIntensity: 0.6 }), 0, 4.1, 0, 0.45, 0.6, 0.45, real);
  const len = R - 3.5;
  mesh(G.box, beltMat, -len / 2 + 0.4, 0.15, 0, len, 0.3, 1.1, real, false, true);
  for (const sd of [-1, 1]) mesh(G.box, mat(0x454b66), -len / 2 + 0.4, 0.22, sd * 0.62, len, 0.3, 0.14, real, false, true);
  const ghost = new THREE.Group();
  ghost.position.copy(real.position);
  ghost.rotation.y = real.rotation.y;
  scene.add(ghost);
  const gm = ghostMat(gd.color, 0.16);
  mesh(G.box, gm, 0, 2.65, 0, 1.9, 1.4, 1.9, ghost, false, false);
  const col = addCylCol(mx, 1.95, mz, 1.15, 1.95, { solid: false });
  const pr = 15.6;
  const padMat = new THREE.MeshStandardMaterial({ color: 0x5c6788, flatShading: true, emissive: 0x000000 });
  const pad = cylPlat(ca * pr, 0.18, sa * pr, 1.35, 0.3, padMat, { pad: i });
  const pring = mesh(G.torus, mat(gd.color), ca * pr, 0.2, sa * pr, 1.42, 1.42, 1.42, scene, false, true);
  pring.rotation.x = Math.PI / 2;
  const label = makeLabel(['', ''], { sx: 3.7, pos: new THREE.Vector3(ca * pr, 3.0, sa * pr), accent: gd.css });
  droppers.push({ i, a, ca, sa, mx, mz, real, ghost, gem, col, pad, padMat, label, ring: pring, timer: rand(0, 1), anim: 1, lastKey: '' });
}

// ---------- 월드 생성 ----------
function buildWorld() {
  // 허브
  const hubCol = island(0, 0, 0, HUB_R, THEMES[0], { hub: true });
  mesh(G.cyl, M.stone, 0, 0.02, 0, 6.5, 0.05, 6.5, scene, false, true);
  for (const z of ZONES) {
    if (!z.dir) continue;
    const [fx, fz] = z.dir;
    mesh(G.box, M.stone, fx * 16.5, 0.015, fz * 16.5, fx ? 20 : 3.2, 0.03, fz ? 20 : 3.2, scene, false, true);
  }
  cylPlat(0, 0.8, 0, 3.2, 0.8, M.pedestal, { pedestal: true });
  const pr = mesh(G.torus, M.gold, 0, 0.8, 0, 3.2, 3.2, 3.2, scene, false, false);
  pr.rotation.x = Math.PI / 2;
  // 허브 나무 / 바위
  for (const deg of [55, 72, 100, 198, 214, 232, 252, 290, 345]) {
    const a = deg * Math.PI / 180, rr = rand(24, 26);
    tree(Math.cos(a) * rr, 0, Math.sin(a) * rr, rand(0.9, 1.25), [0x4fbf5a, 0x63cf6a, 0x3fae55][deg % 3]);
  }
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * TAU, rr = rand(18, 27);
    flowerSpots.push([Math.cos(a) * rr, 0, Math.sin(a) * rr]);
  }
  // 허브 비밀 파쿠르
  const hp = [[-17, 1.2, 16], [-20.5, 2.6, 13], [-23, 4.0, 9.5], [-21, 5.4, 5.5]];
  hp.forEach(([x, t, z], k) => boxPlat(x, t, z, 2, 0.6, 2, mat([0xffd166, 0x6ec8ff, 0xff8fab, 0xb8f28b][k]), {}));
  addStar(-21, 5.4 + 1.5, 5.5, 0);
  addStar(0, 2.1, 2.6, 0);
  const bp = makePlatform(0, 'bounce', 19, 0.3, 9, { round: true, r: 1.2, h: 0.3, v: 20 });
  bp.zone = 0;
  addStar(19, 6.7, 9, 0);

  for (let i = 0; i < GENS.length; i++) buildDropper(i);
  for (const z of ZONES) if (z.dir) buildBridge(z);
  buildLaunchPad();

  // 구역
  for (const z of ZONES) {
    const th = THEMES[z.id];
    if (z.sky) {
      const ec = island(SKY_POS.x, SKY_POS.y, SKY_POS.z, SKY_R, th, { zone: z.id, sky: true });
      decorate(z.id, SKY_POS.x, SKY_POS.y, SKY_POS.z, SKY_R);
      addPortal(SKY_POS.x + 7, SKY_POS.y, SKY_POS.z + 5, z.id, 0.6);
      buildCourse(z.id, SKY_POS, [0, -1], SKY_R - 1, COURSE_SPECS[5], ec, 0.5);
      continue;
    }
    const O = new THREE.Vector3(z.dir[0] * ENTRY_D, 0, z.dir[1] * ENTRY_D);
    const ec = island(O.x, 0, O.z, ENTRY_R, th, { zone: z.id });
    if (z.id === 4) buildTower(z.id, O, z.dir, ec);
    else buildCourse(z.id, O, z.dir, ENTRY_R - 1, COURSE_SPECS[z.id], ec);
    decorate(z.id, O.x, 0, O.z, ENTRY_R);
  }

  // 용암 바다
  {
    const nodes = courses[2].nodes;
    let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
    for (const c of nodes) { x0 = Math.min(x0, c.x - c.hx); x1 = Math.max(x1, c.x + c.hx); z0 = Math.min(z0, c.z - c.hz); z1 = Math.max(z1, c.z + c.hz); }
    x0 -= 14; x1 += 14; z0 -= 18; z1 += 18;
    const lavaMat = new THREE.MeshStandardMaterial({ color: 0xff5a1f, emissive: 0xff3d00, emissiveIntensity: 0.9, roughness: 1, flatShading: true });
    const lm = mesh(G.box, lavaMat, (x0 + x1) / 2, -5.5, (z0 + z1) / 2, x1 - x0, 1, z1 - z0, scene, false, false);
    addBoxCol((x0 + x1) / 2, -5.5, (z0 + z1) / 2, (x1 - x0) / 2, 0.5, (z1 - z0) / 2, { kill: true, lava: true, zone: 2 });
    spinners.push({ kind: 'lava', m: lavaMat });
    for (let i = 0; i < 18; i++) {
      const b = mesh(G.ico, M.lava, rand(x0 + 4, x1 - 4), -5, rand(z0 + 4, z1 - 4), rand(0.4, 1), rand(0.4, 1), rand(0.4, 1), scene, false, false);
      spinners.push({ kind: 'bubble', m: b, ph: Math.random() * 6 });
    }
  }

  // 꽃 (인스턴스)
  {
    const fg = new THREE.ConeGeometry(0.18, 0.35, 5);
    const fm = new THREE.InstancedMesh(fg, new THREE.MeshStandardMaterial({ flatShading: true, roughness: 0.8 }), flowerSpots.length);
    const cols = [0xff6b8b, 0xffd166, 0xffffff, 0xb48cff, 0x6ec8ff];
    flowerSpots.forEach(([x, y, z], i) => {
      _dummy.position.set(x, y + 0.18, z); _dummy.rotation.set(Math.PI, 0, 0); _dummy.scale.setScalar(rand(0.8, 1.3)); _dummy.updateMatrix();
      fm.setMatrixAt(i, _dummy.matrix);
      fm.setColorAt(i, _col.set(cols[i % cols.length]));
    });
    scene.add(fm);
  }

  // 구름
  for (let i = 0; i < 46; i++) {
    const a = Math.random() * TAU, rr = rand(40, 330);
    const low = Math.random() < 0.6;
    makeCloud(Math.cos(a) * rr, low ? rand(-34, -14) : rand(120, 170), Math.sin(a) * rr, rand(2.5, 6));
  }
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * TAU, rr = rand(240, 330);

  const nearTower = Math.abs(cpos.x - TOWER_C.x - 22) < 70 && Math.abs(cpos.z - TOWER_C.z + 40) < 70;
  const night = nearTower ? clamp((cpos.y - 70) / 160, 0, 1) : clamp((cpos.y - 48) / 32, 0, 1);
  skyUni.night.value = night;
  starField.material.opacity = night;
  scene.fog.color.copy(FOG_DAY).lerp(FOG_NIGHT, night);
  hemi.intensity = lerp(1.5, 0.9, night);
  sun.intensity = lerp(2.7, 1.4, night);
}

// ---------- 아바타 애니메이션 ----------
function updateAvatar(dt) {
  avatar.position.set(P.x, P.y, P.z);
  let d = P.face - avatar.rotation.y;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  avatar.rotation.y += d * (1 - Math.exp(-14 * dt));
  const sp = Math.hypot(P.vx, P.vz);
  if (P.grounded) {
    P.walk += dt * sp * 1.5;
    const sw = Math.sin(P.walk) * Math.min(1, sp / 6) * 0.9;
    AV.legL.rotation.x = sw; AV.legR.rotation.x = -sw;
    AV.armL.rotation.x = -sw * 0.8; AV.armR.rotation.x = sw * 0.8;
    AV.armL.rotation.z = AV.armR.rotation.z = 0;
    AV.body.position.y = 1.12 + Math.abs(Math.sin(P.walk)) * 0.05 * Math.min(1, sp / 6);
  } else {
    AV.legL.rotation.x = 0.5; AV.legR.rotation.x = -0.3;
    AV.armL.rotation.x = AV.armR.rotation.x = -0.4;
    AV.armL.rotation.z = -0.9; AV.armR.rotation.z = 0.9;
  }
  avatar.scale.set(1, 1, 1);
  if (P.atkT < 0.34 && typeof curWeapon === 'function') {
    const w = curWeapon(), k = Math.min(1, P.atkT / 0.2), e = 1 - Math.pow(1 - k, 3);
    const A = AV.armR, L2 = AV.armL;
    if (w.kind === 'melee') {
      const c = P.combo || 0;
      if (c === 0) { A.rotation.x = lerp(-2.3, 0.1, e); A.rotation.z = lerp(1.0, -0.8, e); }
      else if (c === 1) { A.rotation.x = lerp(-1.5, -0.7, e); A.rotation.z = lerp(-1.1, 1.2, e); }
      else { A.rotation.x = -1.45; A.rotation.z = lerp(1.2, -0.4, e); L2.rotation.z = -0.9; avatar.rotation.y = P.face + Math.min(1, P.atkT / 0.26) * TAU; }
    } else if (w.kind === 'slam') {
      A.rotation.x = lerp(-3.1, 0.9, e); A.rotation.z = 0; L2.rotation.x = lerp(-3.1, 0.9, e); L2.rotation.z = 0;
      const sq = P.atkT < 0.3 ? Math.sin(Math.min(1, P.atkT / 0.3) * Math.PI) : 0;
      avatar.scale.set(1 + sq * 0.12, 1 - sq * 0.16, 1 + sq * 0.12);
    } else if (w.kind === 'bow') { A.rotation.x = -1.55; A.rotation.z = 0; L2.rotation.x = -1.4; L2.rotation.z = -0.3; }
    else { A.rotation.x = lerp(-2.9, -1.6, e); A.rotation.z = 0; }
  }
  if (P.launch) avatar.rotation.x = Math.sin(gameTime * 3) * 0.2; else avatar.rotation.x = 0;
  // 그림자 원
  let gy = -1e9;
  for (const c of colliders) {
    if (!c.solid || c.top > P.y + 0.05 || c.top < gy) continue;
    if (Math.abs(P.x - c.x) > c.ext + 1 || Math.abs(P.z - c.z) > c.ext + 1) continue;
    if (overlapXZ(c, P.x, P.z, 0.01)) gy = c.top;
  }
  if (gy > -1e8 && P.y - gy < 30) {
    shadowBlob.visible = true;
    shadowBlob.position.set(P.x, gy + 0.03, P.z);
    const s = clamp(1 - (P.y - gy) / 14, 0.35, 1);
    shadowBlob.scale.setScalar(s);
    shadowBlob.material.opacity = 0.3 * s;
  } else shadowBlob.visible = false;
}

function startCourse(zid, c) {

}
function medalFor(zid, t) { const m = MEDALS[zid]; let r = 0; for (let i = 0; i < 4; i++) if (t <= m[i]) r = i + 1; return r; }
function finishCourse(zid, c) {
  const z = zoneById(zid);

  rec.clears++;
  const reward = first ? Math.max(z.reward, totalCps() * 60) : Math.max(z.reward * 0.03, totalCps() * 10);
  earn(reward);
  let newRec = false;
  if (timed && (!rec.best || time < rec.best)) { rec.best = time; newRec = true; }
  let medalLine = '';
  if (timed) {
    const m = medalFor(zid, time), pm = S.medals[zid] || 0;
    if (m > pm) {
      let g = 0;
      for (let i = pm; i < m; i++) g += MEDAL_GEMS[i];
      S.medals[zid] = m;
      const got = earnGems(g);
      medalLine = ' · ' + MEDAL_NAMES[m - 1] + ' 메달! 보석 +' + got;

  const line = '+' + fmt(reward) + ' 코인' + (first ? ' · 수입 영구 +' + Math.round(z.bonus * 100) + '%' : '') + medalLine;
  banner(timed ? (newRec ? '새 기록 ' : '기록 ') + fmtTime(time) : '완주', first ? z.course + ' 첫 완주!' : z.course + ' 완주!', line, 4600);

  else { const sp = trackSpec(TT, floor); r = { x: sp.end.x, y: sp.end.top, z: sp.end.z, yaw: Math.atan2(-DIRS4[floor % 4][0], -DIRS4[floor % 4][1]) }; }

function buyGen(i, n = 1) {

  const before = S.gens[i];

  }
  if (o.ach) for (const a of ACH) S.ach[a.key] = Math.floor(num(o.ach[a.key]));
  if (o.combat && typeof o.combat === 'object') {
    const C = o.combat;
    S.combat.owned = [...new Set(['stick', ...(Array.isArray(C.owned) ? C.owned.filter((id) => WEAPONS.some((w) => w.id === id)) : [])])];
    S.combat.equip = S.combat.owned.includes(C.equip) ? C.equip : 'stick';
    for (const k of ['mastery', 'vital', 'kills', 'bossKills']) S.combat[k] = Math.floor(num(C[k]));
  }
  if (o.raid) for (const b of BOSSES) S.raid[b.id] = Math.floor(num(o.raid[b.id]));
  if (o.skin && typeof o.skin === 'object') {
    const owned = Array.isArray(o.skin.owned) ? o.skin.owned.filter((x) => typeof x === 'string') : [];
    S.skin.owned = [...new Set(['blue', 'cap', 'none', ...owned])];
    for (const [k, list] of [['shirt', SHIRTS], ['hat', HATS], ['trail', TRAILS]]) if (list.some((x) => x.id === o.skin[k]) && S.skin.owned.includes(o.skin[k])) S.skin[k] = o.skin[k];
  }
  S.stars = Array.isArray(o.stars) ? o.stars.filter((id) => stars.some((s) => s.id === id)) : [];
  S.quest = Math.floor(S.quest);
  S.mute = !!o.mute; S.welcomed = !!o.welcomed;
  S.seenV2 = !!o.seenV2;
  S.seenV3 = !!o.seenV3;
  if (v1) {
    // 1.0 저장 이전: 환생 토큰 → 환생 레벨/포인트, 기존 진행에 맞춰 보석 지급
    const tok = Math.floor(num(o.tokens, 0));
    S.rlv = tok; S.rp = tok;
    S.gems = S.stars.length * 3 + Object.keys(S.courses).length * 10;
    S.gemsTotal = S.gems;
    S.quest = 0;
  }
}

  for (const b of buffs) if (b.end > now) items.push([b.kind, b.label + ' · ' + Math.ceil((b.end - now) / 1000) + '초']);
  const key = items.map((x) => x[1]).join('|');

    const box = $('buffs');
    box.innerHTML = '';

    box.classList.toggle('hidden', !items.length);

  dirty = false;
}

const mm = $('minimap'), mctx = mm.getContext('2d');
function drawMinimap() {
  const W = mm.width, Hh = mm.height, cx = W / 2, cy = Hh / 2;
  const s = (W / 2) / 95;
  const c = mctx;
  c.clearRect(0, 0, W, Hh);
  c.save();
  c.beginPath(); c.arc(cx, cy, W / 2, 0, TAU); c.clip();
  c.fillStyle = 'rgba(24,34,66,0.9)'; c.fillRect(0, 0, W, Hh);
  const inSky = inSkyZone(P.x, P.y, P.z);
  const tx = (x) => cx + (x - P.x) * s, tz = (z) => cy + (z - P.z) * s;
  for (const is of islands) {
    if ((is.y > 60) !== inSky) continue;
    c.fillStyle = '#' + new THREE.Color(is.color).getHexString();
    c.globalAlpha = 0.9;
    c.beginPath(); c.arc(tx(is.x), tz(is.z), is.r * s, 0, TAU); c.fill();
  }
  c.globalAlpha = 1;
  for (const z of ZONES) {
    if (!z.dir || !S.zones[z.id] || inSky) continue;
    const d = bridges[z.id].deck;
    c.fillStyle = '#c08a55';
    c.fillRect(tx(d.x - d.hx), tz(d.z - d.hz), d.hx * 2 * s, d.hz * 2 * s);
  }
  const drawCol = (n, color) => {
    const x = tx(n.x), y = tz(n.z);
    if (x < -10 || x > W + 10 || y < -10 || y > Hh + 10) return;
    c.fillStyle = color;
    const w = Math.max(4, n.hx * 2 * s), h = Math.max(4, n.hz * 2 * s);
    c.fillRect(x - w / 2, y - h / 2, w, h);
  };
  for (const C of Object.values(courses)) {
    const col = zoneById(C.zid).css;
    for (const n of C.nodes) if ((n.top > 60) === inSky) drawCol(n, col);
  }
  for (const T of [TT, DT]) {
    if (!T) continue;
    for (const b of T.built.values()) for (const n of b.cols) if (Math.abs(n.top - P.y) < 14 && !n.kill) drawCol(n, n.tcorner != null ? '#3ee6a5' : T.name === 'tower' ? '#c3a6ff' : '#ffd166');
  }
  for (const st of stars) {
    if (st.taken || (st.y > 60) !== inSky) continue;
    const x = tx(st.x), y = tz(st.z);
    if (Math.hypot(x - cx, y - cy) > W / 2) continue;
    c.fillStyle = '#ffd23f';
    c.beginPath(); c.arc(x, y, 5, 0, TAU); c.fill();
    c.strokeStyle = '#7a5200'; c.lineWidth = 2; c.stroke();
  }
  if (!inSky) {
    c.fillStyle = S.launch ? '#ffd166' : '#8a94b4';
    c.beginPath(); c.arc(tx(LAUNCH_POS.x), tz(LAUNCH_POS.z), 6, 0, TAU); c.fill();
  }
  if (inHunt() || raid) {
    for (const m of monsters) {
      if (!m.alive) continue;
      const x = tx(m.x), y = tz(m.z);
      if (Math.hypot(x - cx, y - cy) > W / 2) continue;
      c.fillStyle = m.elite ? '#ffcf3f' : '#ff5a5f';
      c.beginPath(); c.arc(x, y, m.elite ? 6 : 4, 0, TAU); c.fill();
    }
    if (raid && raid.boss.alive) { c.fillStyle = '#c77dff'; c.beginPath(); c.arc(tx(raid.boss.x), tz(raid.boss.z), 10, 0, TAU); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke(); }
  }
  if (goldOrb && !goldOrb.taken) {
    let x = tx(goldOrb.x), y = tz(goldOrb.z);
    const dd = Math.hypot(x - cx, y - cy), R = W / 2 - 12;
    if (dd > R) { x = cx + (x - cx) / dd * R; y = cy + (y - cy) / dd * R; }
    c.fillStyle = Math.floor(performance.now() / 250) % 2 ? '#ffd23f' : '#ffffff';
    c.beginPath(); c.arc(x, y, 9, 0, TAU); c.fill();
    c.strokeStyle = '#7a5200'; c.lineWidth = 3; c.stroke();
  }
  c.translate(cx, cy);
  c.rotate(-cam.yaw);
  c.fillStyle = 'rgba(255,255,255,0.18)';
  c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 60, -Math.PI / 2 - 0.55, -Math.PI / 2 + 0.55); c.closePath(); c.fill();
  c.rotate(cam.yaw);
  c.rotate(-avatar.rotation.y);
  c.fillStyle = '#ffffff';
  c.strokeStyle = '#1a1f3a'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(0, -14); c.lineTo(10, 10); c.lineTo(0, 5); c.lineTo(-10, 10); c.closePath(); c.fill(); c.stroke();
  c.restore();
  c.fillStyle = '#ffffff'; c.font = '26px ' + FONT; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('N', cx, 22);
}

function luckLv() { return S.rup.luck || 0; }
function spawnGold() {
  const cand = [];
  for (const c of colliders) {
    if (!c.solid || c.kill || c.move || c.fade || c.bounce || c.pad != null || c.bridgePad || c.launchPad || c.portal || c.towerGate || c.dailyGate || c.towerCont || c.pedestal) continue;
    if (c.t === 'b' && (c.hx < 1 || c.hz < 1)) continue;
    if (c.t === 'c' && c.r < 1.1) continue;
    const dx = c.x - P.x, dz = c.z - P.z, d = Math.hypot(dx, dz);
    if (d < 10 || d > 75 || Math.abs(c.top - P.y) > 18) continue;
    if (inSkyZone(c.x, c.top, c.z) !== inSkyZone(P.x, P.y, P.z)) continue;
    cand.push(c);
  }
  if (!cand.length) { goldNext = performance.now() + 20000; return; }
  const c = cand[Math.floor(Math.random() * cand.length)];
  let x = c.x, z = c.z;
  if (c.island) { const a = Math.random() * TAU, r = c.r * rand(0.2, 0.6); x += Math.cos(a) * r; z += Math.sin(a) * r; }
  const life = 40000 * (1 + 0.1 * luckLv());
  goldOrb = { x, y: c.top + 1.4, z, end: performance.now() + life, taken: false };
  goldGroup.position.set(x, goldOrb.y, z);
  goldGroup.visible = true;
  SFX.star();
  toast('황금 별똥별이 떨어졌어요! 40초 안에 잡으세요', 'gold', 3200);
}

function updateGold(dt) {

function updateFx(dt) {
  for (let i = fxList.length - 1; i >= 0; i--) {
    const f = fxList[i];
    f.t += dt;
    f.upd(f.t, dt);
    if (f.t >= f.life) { scene.remove(f.obj); if (f.disp) f.disp(); fxList.splice(i, 1); }
  }
  for (const L of fxLights) {
    if (L.t >= L.dur) { if (L.l.intensity !== 0) L.l.intensity = 0; continue; }
    L.t += dt;

function spawnCube(D) {

  if (idx < 0) return;

  Object.assign(c, { on: true, D, ph: 0, t: 0, x: D.mx, y: 1.2, z: D.mz, r: 11.8 });
  cubeMesh.setColorAt(idx, _col.set(GENS[D.i].color));

function updateCubes(dt) {
  for (let i = 0; i < CUBE_MAX; i++) {
    const c = cubes[i];
    if (!c.on) continue;
    c.t += dt;
    let s = 0.42;
    if (c.ph === 0) {
      c.y -= dt * 7;
      if (c.y <= 0.52) { c.y = 0.52; c.ph = 1; }
    } else if (c.ph === 1) {
      c.r -= dt * 2.8;
      c.x = c.D.ca * c.r; c.z = c.D.sa * c.r;
      if (c.r <= 3.9) { c.ph = 2; c.t = 0; c.sx = c.x; c.sz = c.z; }
    } else {
      const k = Math.min(1, c.t / 0.45);
      const e = k * k;
      c.x = lerp(c.sx, 0, e); c.z = lerp(c.sz, 0, e); c.y = lerp(0.52, 3.9, Math.sin(k * Math.PI / 2));
      s = 0.42 * (1 - k * 0.8);
      if (k >= 1) { c.on = false; crystalPulse = Math.max(crystalPulse, 0.35); }
    }
    _dummy.position.set(c.x, c.y, c.z);
    _dummy.rotation.set(c.t * 2, c.t * 3, 0);
    _dummy.scale.setScalar(c.on ? s : 0);
    _dummy.updateMatrix();
    cubeMesh.setMatrixAt(i, _dummy.matrix);
  }
  cubeMesh.instanceMatrix.needsUpdate = true;
}

  beltTex.offset.x -= dt * 0.35;
  // 안내 화살표 (첫 드로퍼)
  if (S.gens[0] === 0 && S.coins >= GENS[0].cost) {
    const D = droppers[0], pr = 15.6;
    guideArrow.visible = true;
    guideArrow.position.set(D.ca * pr, 3.3 + Math.sin(t * 5) * 0.35, D.sa * pr);
    guideArrow.rotation.y += dt * 3;
  } else guideArrow.visible = false;
  // 다리 애니메이션
  for (const z of ZONES) {
    if (!z.dir) continue;
    const B = bridges[z.id];
    if (B.anim < 1 && S.zones[z.id]) { B.anim = Math.min(1, B.anim + dt * 0.9); setBridgeScale(B, 1 - Math.pow(1 - B.anim, 3)); }
  }
  // 별
  for (const st of stars) {
    if (st.taken) continue;
    st.mesh.rotation.y += dt * 2;
    st.mesh.position.y = st.y + Math.sin(t * 2 + st.ph) * 0.15;
  }
  // 포털
  for (const p of portals) { p.ring.rotation.z += dt * 1.5; p.disc.material.opacity = 0.3 + Math.sin(t * 3) * 0.1; }
  // 발사대
  if (launchPad.arrows.visible) launchPad.arrows.children.forEach((a, i) => { a.position.y = a.userData.base + ((t * 1.5 + i * 0.33) % 1) * 0.8; });
  // 구름
  for (const c of clouds) { c.position.x += c.userData.v * dt; if (c.position.x > 340) c.position.x = -340; }
  // 장식
  for (const s of spinners) {
    if (s.kind === 'lava') s.m.emissiveIntensity = 0.8 + Math.sin(t * 2) * 0.2;
    else if (s.kind === 'bubble') { s.m.position.y = -5 + Math.abs(Math.sin(t * 1.3 + s.ph)) * 0.8; }
    else if (s.kind === 'smoke' && Math.random() < dt * 3) burst(s.x, s.y, s.z, [0xff8f3f, 0x6b5560], 1, 0.6, 0.35, 2, -0.05, 2);
  }
}

//  메인 루프
// =====================================================================
let last = performance.now(), acc = 0;
const STEP = 1 / 120;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(Math.max(0, (now - last) / 1000), 3600);
  last = now;
  // 경제 (실제 경과 시간 기준)
  earn(baseCps() * rdt);
  autoAcc += autoRate() * rdt;
  if (autoAcc >= 1) {
    const n = Math.floor(autoAcc);
    autoAcc -= n;
    earn(clickValue() * n);
    crystalPulse = Math.max(crystalPulse, 0.5);
  }
  S.play += rdt;
  const dt = Math.min(rdt, 0.05);
  // 물리 (고정 스텝)
  const frozen = hitStop > 0;
  if (frozen) hitStop -= rdt;
  if (!modalOpen && !frozen) {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 8) { physicsStep(STEP); acc -= STEP; n++; }
    if (n >= 8) acc = 0;
  }
  updateAvatar(dt);
  updateCamera(dt);
  updateWorldFx(dt);
  if (!modalOpen && !frozen) updateCombat(dt);
  if (!window.__fxFreeze) updateFx(dt);
  updateGold(dt);
  updateTrail(dt);
  updateParticles(dt);
  // 주기 작업
  padT -= rdt; if (padT <= 0) { padT = 0.4; refreshPads(false); }
  questT -= rdt; if (questT <= 0) { questT = 0.5; checkQuest(); }
  mmT -= rdt; if (mmT <= 0) { mmT = 1 / 20; drawMinimap(); }
  saveT -= rdt; if (saveT <= 0) { saveT = 6; save(); }
  trackT -= rdt; if (trackT <= 0) { trackT = 1; towerWindow(false); checkAch(); if (dateKey() !== dailyBuildKey && P.trackOn !== 'daily') { rebuildDaily(); syncTrackSigns(); } }
  updateHUD(rdt);
  renderer.render(scene, camera);
}

async function submitFeedback() {

  fb.busy = true;

  say('');

// 일반 웹(https)에서 FormSubmit으로 개발자 메일에 바로 보내요. claude.ai 안에서는 외부 요청이 막혀 있어 건너뛰어요.
async function fbMail(item) {
  if (!FB_EMAIL || inClaude() || !/^https?:$/.test(location.protocol)) return null;
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const tm = setTimeout(() => { if (ctl) ctl.abort(); }, 12000);
  try {
    const body = {
      _subject: '[' + GAME_NAME + '] ' + item.kindName + ' 피드백',
      _template: 'table',
      _captcha: 'false',
      '종류': item.kindName,
      '내용': item.text,
      '연락처': item.from || '(없음)',
      '진행 상황': item.info,
      '기기': item.ua,
      '보낸 시각': new Date(item.at).toLocaleString('ko-KR'),
    };
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(item.from)) body._replyto = item.from;
    const r = await fetch(FB_ENDPOINT + FB_EMAIL, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined });
    const d = await r.json().catch(() => ({}));
    if (r.ok && String(d.success) === 'true') return 'mail';
    console.warn('[feedback] 메일 전송 실패', d && d.message);
    return null;
  } catch (e) { return null; } finally { clearTimeout(tm); }
}
// claude.ai에서 열었을 때: 게임 저장소(feedback/<사용자>/items)에 보관해요. 개발자(소유자)만 읽을 수 있어요.
async function fbStore(item) {
  if (!cloud.db || !cloud.uid) return null;
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  try {
    await Promise.race([
      cloud.db.doc('feedback/' + cloud.uid + '/items/' + id).set(item),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000)),
    ]);
    return 'stored';
  } catch (e) { return null; }
}
